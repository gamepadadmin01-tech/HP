# XcodeGen project spec — run `xcodegen` in this folder on the Mac to produce
# GamepadOS.xcodeproj (see README_MAC_SETUP.md). Kept in YAML so the project
# file never has to be hand-merged.
name: GamepadOS
options:
  bundleIdPrefix: com.gamepad
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true

targets:
  GamepadOS:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: Sources
      # Folder reference: the built controller-ui bundle ships verbatim and is
      # loaded from Bundle.main under the "WebBundle" subdirectory.
      - path: WebBundle
        type: folder
        buildPhase: resources
      - path: Shim
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.gamepad.client
        TARGETED_DEVICE_FAMILY: "1"          # iPhone only for v1
        SWIFT_VERSION: "5.9"
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        DEVELOPMENT_TEAM: ""                 # set your team in Xcode > Signing
    info:
      path: Generated/Info.plist
      properties:
        CFBundleDisplayName: GamepadOS
        # Keep version parity with the Android client (1.3.0 / 22).
        CFBundleShortVersionString: "1.3.0"
        CFBundleVersion: "22"
        UIRequiresFullScreen: true
        UIStatusBarHidden: true
        UIViewControllerBasedStatusBarAppearance: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSCameraUsageDescription: "GamepadOS scans the pairing QR code shown by the PC server."
        NSLocalNetworkUsageDescription: "GamepadOS sends controller input to your PC over your local network."
        NSMotionUsageDescription: "Tilt steering uses the device motion sensors."
        # Let the WKWebView animate at 120 Hz on ProMotion phones (parity with
        # the Android preferredDisplayModeId max-refresh pick).
        CADisableMinimumFrameDurationOnPhone: true
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
