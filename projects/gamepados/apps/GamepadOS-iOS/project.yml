# XcodeGen project spec — run `xcodegen` in this folder on the Mac to produce
# GamepadOS.xcodeproj (see README_MAC_SETUP.md). Kept in YAML so the project
# file never has to be hand-merged.
name: GamepadOS
options:
  bundleIdPrefix: com.gamepad
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true

targets:
  GamepadOS:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: Sources
      # Folder reference: the built controller-ui bundle ships verbatim and is
      # loaded from Bundle.main under the "WebBundle" subdirectory.
      - path: WebBundle
        type: folder
        buildPhase: resources
      - path: Shim
        buildPhase: resources
      - path: Assets.xcassets
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.gamepad.client.akhil
        TARGETED_DEVICE_FAMILY: "1"          # iPhone only for v1
        SWIFT_VERSION: "5.9"
        DEVELOPMENT_TEAM: 46PX2Z3779         # personal team (auto signing)
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: Generated/Info.plist
      properties:
        CFBundleDisplayName: GamepadOS
        # iOS versions independently of Android (user decision 2026-07-06):
        # fresh platform, fresh 1.0.0 line. The UI's update checker reads the
        # manifest's `ios` entry (absent = current), so Android's higher
        # versionCode can never trigger a phantom update here.
        CFBundleShortVersionString: "1.0.0"
        CFBundleVersion: "1"
        # REQUIRED in the plist itself (INFOPLIST_KEY_* build settings are
        # ignored with a custom Info.plist): without UILaunchScreen, iOS runs
        # the app LETTERBOXED at legacy resolution — black bars, tiny UI.
        UILaunchScreen: {}
        UIRequiresFullScreen: true
        UIStatusBarHidden: true
        UIViewControllerBasedStatusBarAppearance: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSCameraUsageDescription: "GamepadOS scans the pairing QR code shown by the PC server."
        NSLocalNetworkUsageDescription: "GamepadOS sends controller input to your PC over your local network."
        NSMotionUsageDescription: "Tilt steering uses the device motion sensors."
        # Let the WKWebView animate at 120 Hz on ProMotion phones (parity with
        # the Android preferredDisplayModeId max-refresh pick).
        CADisableMinimumFrameDurationOnPhone: true
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
