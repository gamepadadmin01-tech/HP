<!doctype html>
<html><head><meta charset="utf-8">
<style>
* { margin:0; padding:0; box-sizing:border-box; }
html,body { width:1024px; height:500px; overflow:hidden; }
body {
  position:relative;
  background:#0a0a0c;
  font-family:'Segoe UI', Arial, sans-serif;
  -webkit-font-smoothing:antialiased;
}

/* ---------- background layers ---------- */
.bg-grad {
  position:absolute; inset:0;
  background:
    radial-gradient(720px 460px at 74% 42%, rgba(255,255,255,.075), transparent 62%),
    radial-gradient(560px 380px at 12% 88%, rgba(255,255,255,.035), transparent 60%),
    linear-gradient(115deg, #101014 0%, #0a0a0c 45%, #0d0d10 100%);
}
.bg-grid {
  position:absolute; inset:0;
  background-image:
    repeating-linear-gradient(90deg, rgba(255,255,255,.028) 0 1px, transparent 1px 52px),
    repeating-linear-gradient(0deg, rgba(255,255,255,.028) 0 1px, transparent 1px 52px);
  -webkit-mask-image: radial-gradient(closest-side at 68% 50%, #000 30%, transparent 100%);
}
.streak {
  position:absolute; top:-80px; left:340px; width:520px; height:700px;
  background: linear-gradient(75deg, transparent 42%, rgba(255,255,255,.05) 50%, transparent 58%);
  transform: rotate(8deg);
}
.vignette {
  position:absolute; inset:0;
  box-shadow: inset 0 0 160px 40px rgba(0,0,0,.85);
}

/* ---------- left text block ---------- */
.copy { position:absolute; left:52px; top:88px; z-index:30; }
.title {
  font-size:68px; font-weight:800; letter-spacing:-1.5px; line-height:1;
  background: linear-gradient(180deg, #ffffff 30%, #b9b9c0 100%);
  -webkit-background-clip:text; -webkit-text-fill-color:transparent;
}
.sub {
  margin-top:16px; font-size:25px; font-weight:600; color:#a7a7ae; letter-spacing:.2px;
}
.chips { position:absolute; left:52px; bottom:52px; z-index:30; display:grid;
  grid-template-columns:auto auto; gap:12px; }
.chip {
  display:flex; align-items:center; gap:9px;
  padding:10px 18px; border-radius:999px;
  border:1px solid rgba(255,255,255,.22);
  background: linear-gradient(180deg, rgba(255,255,255,.07), rgba(255,255,255,.02));
  color:#f0f0f2; font-size:18px; font-weight:600; white-space:nowrap;
  box-shadow: 0 8px 24px rgba(0,0,0,.5);
}
.chip .dot { width:7px; height:7px; border-radius:50%; background:#e8e8ec; opacity:.85; }

/* ---------- monitor ---------- */
.monitor { position:absolute; right:84px; top:22px; z-index:10; }
.mon-frame {
  width:452px; padding:11px; border-radius:12px;
  background: linear-gradient(180deg, #1c1d21, #0e0e11);
  border:1px solid rgba(255,255,255,.10);
  box-shadow: 0 30px 70px rgba(0,0,0,.75), 0 4px 18px rgba(0,0,0,.6);
}
.mon-screen { width:430px; height:230px; border-radius:6px; overflow:hidden; background:#0b0b0d; }
.mon-screen svg { display:block; width:100%; height:100%; }
.mon-stand {
  width:74px; height:26px; margin:0 auto;
  background: linear-gradient(180deg, #17181b, #0c0c0e);
  clip-path: polygon(18% 0, 82% 0, 100% 100%, 0 100%);
}
.mon-base { width:170px; height:9px; margin:0 auto; border-radius:5px;
  background:#141518; border:1px solid rgba(255,255,255,.07); }

/* ---------- phone ---------- */
.phone-wrap { position:absolute; left:472px; top:246px; z-index:20;
  transform: perspective(1400px) rotateY(-7deg) rotateX(3.5deg) rotate(-3.5deg); }
.phone {
  position:relative;
  padding:13px 16px; border-radius:30px;
  background: linear-gradient(150deg, #2b2d32 0%, #131417 55%, #1d1e22 100%);
  border:1px solid rgba(255,255,255,.16);
  box-shadow:
    0 46px 90px rgba(0,0,0,.9),
    0 10px 30px rgba(0,0,0,.65),
    inset 0 1px 1px rgba(255,255,255,.14);
}
.phone-screen { width:472px; height:212px; border-radius:16px; overflow:hidden;
  background:#000; border:1px solid rgba(0,0,0,.8); }
.phone-screen img { width:100%; height:100%; object-fit:cover; display:block; }
.phone .btn1 { position:absolute; right:-3px; top:64px; width:4px; height:42px;
  border-radius:3px; background:#3a3b40; }
.phone-glow {
  position:absolute; left:30px; right:30px; bottom:-34px; height:50px;
  background: radial-gradient(closest-side, rgba(0,0,0,.9), transparent);
  filter: blur(10px); z-index:-1;
}

/* ---------- wifi link ---------- */
.link-svg { position:absolute; left:0; top:0; z-index:15; pointer-events:none; }
</style></head>
