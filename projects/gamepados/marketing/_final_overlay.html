<style>
* { margin:0; padding:0; box-sizing:border-box; }
html,body { width:1024px; height:500px; overflow:hidden; }
body { position:relative; font-family:'Segoe UI',Arial,sans-serif; background:#000; }
.photo { position:absolute; inset:0; }
.photo img { width:1024px; height:500px; display:block; }
.scrim {
  position:absolute; inset:0;
  background:
    radial-gradient(720px 420px at -6% 6%, rgba(4,4,6,.93) 22%, rgba(4,4,6,.72) 45%, transparent 70%),

}
.copy { position:absolute; left:50px; top:64px; z-index:30; }
.title {
  font-size:66px; font-weight:800; letter-spacing:-1.5px; line-height:1;
  background: linear-gradient(180deg, #ffffff 30%, #b4b4bc 100%);
  -webkit-background-clip:text; -webkit-text-fill-color:transparent;
}
.sub { margin-top:14px; font-size:24px; font-weight:600; color:#c2c2c8;
  text-shadow:0 2px 14px rgba(0,0,0,.9); }
.chips { position:absolute; left:50px; bottom:34px; z-index:30; display:flex; gap:11px; }
.chip {
  display:flex; align-items:center; gap:8px;
  padding:9px 17px; border-radius:999px;
  border:1px solid rgba(255,255,255,.30);
  background: rgba(8,8,10,.55);
  -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px);
  color:#f2f2f4; font-size:17px; font-weight:600; white-space:nowrap;
}
.chip .dot { width:6px; height:6px; border-radius:50%; background:#fff; opacity:.9; }
