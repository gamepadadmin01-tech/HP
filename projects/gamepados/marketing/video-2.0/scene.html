<!doctype html>
<!--
  GamepadOS 2.0 promo video, drawn frame by frame (2026-11-18).
  Every element's position is a pure function of time: render(t) draws the frame at t seconds.
  render.mjs opens this page in Chrome, calls render(t) for each frame and records it.

  ?mode=play  -> the 32 s Google Play preview (1920x1080 stage, recorded at 2x = 4K)
  ?mode=web   -> the 15 s seamless website loop, no captions (landscape)
  ?mode=webp  -> the same loop for phones (portrait 1080x1920 stage)
  ?lang=en    -> caption language (CAPTIONS below; add a language there for 2.1)

  Timing: 120 BPM, one bar = 2 s. Every scene starts on a bar, taps land on beats, so cuts match music.py.
-->
<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@500;600&family=Noto+Sans+SC:wght@500;700&family=Noto+Sans+JP:wght@500;700&family=Noto+Sans+Devanagari:wght@500;700&display=block" rel="stylesheet">
<style>
  :root { --bg:#1A1210; --bg2:#140D0B; --or:#FF5500; --tx:#F6EDE9; --mu:#A89A93; --gr:#7BD88F; }
  * { margin:0; box-sizing:border-box; }
  html, body { overflow:hidden; background:var(--bg); }
  #stage { position:relative; overflow:hidden; background:var(--bg); color:var(--tx);
    font-family:'Inter','Noto Sans SC','Noto Sans JP','Noto Sans Devanagari',sans-serif; }
  .abs { position:absolute; left:0; top:0; will-change:transform,opacity; transform-origin:50% 50%; }
  #glow { position:absolute; inset:-10%; }

  /* phones: positioned by their centre (translate -50%) */
  .phone { background:#0C0807; border-radius:56px; padding:18px;
    box-shadow:0 0 0 2px rgba(255,255,255,0.10), 0 40px 110px rgba(0,0,0,0.65), 0 0 80px rgba(255,85,0,0.16); }
  .phone .scr { position:relative; overflow:hidden; border-radius:40px; background:#120A07; }
  .phone .scr > img, .phone .scr > .layer { position:absolute; inset:0; width:100%; height:100%; display:block; }
  .phone .scr > img { object-fit:cover; object-position:top; }
  #phoneL .scr { width:1100px; height:495px; }   /* 20:9, a normal Android phone (POCO X6 Pro) */
  #phoneP { border-radius:52px; padding:16px; }
  #phoneP .scr { width:342px; height:760px; border-radius:38px; }
  .dark { background:#000; }

  /* monitor */
  #monitor .bez { width:1164px; height:674px; padding:22px; border-radius:26px; background:#0B0706;
    box-shadow:0 0 0 2px rgba(255,255,255,0.08), 0 50px 120px rgba(0,0,0,0.6); }
  #monitor .mscr { position:relative; width:1120px; height:630px; border-radius:8px; overflow:hidden; background:#0d0708; }
  #monitor canvas { position:absolute; inset:0; width:100%; height:100%; }
  #monitor .neck { width:120px; height:70px; margin:0 auto; background:linear-gradient(#0B0706,#1d1411); }
  #monitor .foot { width:380px; height:18px; margin:0 auto; border-radius:10px 10px 4px 4px; background:#221815;
    box-shadow:0 0 0 1px rgba(255,255,255,0.06); }
  #server { position:absolute; inset:0; background:#16100E; display:flex; align-items:center; justify-content:center; gap:70px; padding:0 80px; }
  #server .ttl { display:flex; align-items:center; gap:14px; font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:34px; }
  #server .ttl img { width:52px; height:52px; border-radius:13px; }
  #server .txt p { margin-top:16px; font-size:24px; color:var(--mu); max-width:420px; line-height:1.35; }
  #server .st { margin-top:34px; display:inline-flex; align-items:center; gap:12px; font-size:24px; font-weight:600;
    padding:12px 22px; border-radius:999px; background:rgba(255,255,255,0.05); color:var(--mu); }
  #server .st i { width:12px; height:12px; border-radius:50%; background:#6b5d57; display:block; }
  #server .st.on { color:var(--gr); background:rgba(123,216,143,0.10); }
  #server .st.on i { background:var(--gr); box-shadow:0 0 12px var(--gr); }
  #server .qr { width:300px; height:300px; padding:18px; background:#F6EDE9; border-radius:18px; flex:none; }

  /* captions */
  #cap { position:absolute; left:0; right:0; top:62px; text-align:center; }
  #cap h1 { font-family:'Space Grotesk','Noto Sans SC','Noto Sans JP','Noto Sans Devanagari',sans-serif; font-weight:700;
    font-size:76px; line-height:1.08; letter-spacing:-0.02em; }
  #cap h1 em, .em { font-style:normal; color:var(--or); }

  /* overlays */
  .ripple { position:absolute; width:120px; height:120px; margin:-60px 0 0 -60px; border-radius:50%;
    border:5px solid rgba(255,255,255,0.9); }
  .press { position:absolute; width:90px; height:90px; margin:-45px 0 0 -45px; border-radius:50%; background:rgba(255,255,255,0.55); }
  .finger { position:absolute; width:96px; height:96px; margin:-48px 0 0 -48px; border-radius:50%;
    background:rgba(255,255,255,0.28); border:3px solid rgba(255,255,255,0.75); }
  .pill { display:inline-flex; align-items:center; gap:14px; padding:16px 30px; border-radius:999px; font-weight:600; font-size:34px; white-space:nowrap; }
  #okpill { background:#13251A; color:var(--gr); box-shadow:0 0 0 2px rgba(123,216,143,0.35), 0 18px 50px rgba(0,0,0,0.5); }
  #okpill i { width:16px; height:16px; border-radius:50%; background:var(--gr); box-shadow:0 0 14px var(--gr); display:block; }
  .label { font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:40px; color:var(--tx); white-space:nowrap; }
  .badge { font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:34px; padding:8px 22px; border-radius:999px;
    background:var(--or); color:#140D0B; white-space:nowrap; }
  .mini { background:#0C0807; border-radius:22px; padding:8px; box-shadow:0 0 0 2px rgba(255,255,255,0.10), 0 20px 50px rgba(0,0,0,0.6); }
  .mini img { width:340px; height:153px; border-radius:15px; display:block; object-fit:cover; }

  /* camera view inside the portrait phone */
  #cam { background:#0E0B0A; }
  #cam .qrv { position:absolute; left:50%; top:46%; width:240px; height:240px; margin:-120px 0 0 -120px; padding:13px; background:#E9DFDA; border-radius:12px; }
  #cam .corners { position:absolute; left:50%; top:46%; width:280px; height:280px; margin:-140px 0 0 -140px; }
  #cam .line { position:absolute; left:50%; width:262px; height:4px; margin-left:-131px; background:var(--or); box-shadow:0 0 18px var(--or); border-radius:2px; }
  #cam .hint { position:absolute; left:0; right:0; bottom:70px; text-align:center; font-size:22px; color:#d9cdc8; }
  #flash { background:#fff; }

  /* end card */
  #end { position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; }
  #end img { width:230px; height:230px; border-radius:52px; box-shadow:0 30px 90px rgba(255,85,0,0.35); }
  #end h2 { margin-top:40px; font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:104px; letter-spacing:-0.02em; }
  #end p { margin-top:12px; font-size:40px; color:var(--mu); }
  #end .gp { margin-top:46px; padding:18px 40px; border-radius:999px; border:2px solid var(--or); color:var(--tx); font-size:34px; font-weight:600; }
  svg { overflow:visible; }
</style></head>
<body>
<div id="stage">
  <div id="glow"></div>

  <div id="monitor" class="abs">
    <div class="bez"><div class="mscr">
      <canvas id="game" width="2240" height="1260"></canvas>
      <div id="server">
        <div class="txt">
          <div class="ttl"><img src="../store-graphics/play-icon-512.png">GamepadServer</div>
          <p>Scan this code with the GamepadOS app on your phone.</p>
          <div class="st" id="srvst"><i></i><span>Waiting for your phone</span></div>
        </div>
        <svg class="qr" id="qr1" viewBox="0 0 29 29"></svg>
      </div>
    </div></div>
    <div class="neck"></div><div class="foot"></div>
  </div>

  <svg id="links" class="abs" width="1920" height="1080" style="transform:none"></svg>

  <div id="phoneL" class="abs phone"><div class="scr">
    <img id="imC" src="../store-graphics/play-2026-11/raw-poco/controller.png">
    <img id="imR" src="../store-graphics/play-2026-11/raw-poco/racing.png">
    <img id="imE" src="../store-graphics/play-2026-11/raw-poco/editor.png">
    <div class="layer" id="edit"></div>
    <div class="layer" id="taps"></div>
    <div class="layer dark" id="darkL"></div>
  </div></div>

  <div id="phoneP" class="abs phone"><div class="scr">
    <img id="imConn" src="../store-graphics/play-2026-11/raw-poco/connect.png">
    <div class="layer" id="cam">
      <svg class="qrv" id="qr2" viewBox="0 0 29 29"></svg>
      <svg class="corners" viewBox="0 0 350 350"><g fill="none" stroke="#FF5500" stroke-width="8" stroke-linecap="round">
        <path d="M4 70V4h66M280 4h66v66M346 280v66h-66M70 346H4v-66"/></g></svg>
      <div class="line" id="scanline"></div>
      <div class="hint">Point at the code on your PC</div>
    </div>
    <img id="imHome" src="../store-graphics/play-2026-11/raw-poco/home.png">
    <div class="layer" id="flash"></div>
  </div></div>

  <div id="minis"></div>
  <div id="fx"></div>

  <div id="okpill" class="abs pill"><i></i>Connected</div>
  <div id="cap"><h1 id="capt"></h1></div>
  <div id="end">
    <img id="endIcon" src="../store-graphics/play-icon-512.png">
    <h2 id="endName">GamepadOS</h2>
    <p id="endTag"></p>
    <div class="gp" id="endGp"></div>
  </div>
</div>

<script>
// ---------- captions: one entry per scene. Add a language here for 2.1; nothing else changes. ----------
const CAPTIONS = {
  en: {
    lines: ['Your phone is now a {PC gamepad}', 'Play PC games {with your phone}', '{Wi-Fi} or {USB}. Low latency.',
      'Scan the code. {Start playing.}', 'Tilt to {steer}', 'Build your own {layout}', 'Up to {4 players} on one PC'],
    tag: 'Turn your phone into a PC gamepad', gp: 'Get it on Google Play', wifi: 'Wi-Fi', usb: 'USB',
  },
};

const Q = new URLSearchParams(location.search);
const MODE = Q.get('mode') || 'play';
const LANG = Q.get('lang') || 'en';
const TX = CAPTIONS[LANG] || CAPTIONS.en;
const PORTRAIT = MODE === 'webp';
const SW = PORTRAIT ? 1080 : 1920, SH = PORTRAIT ? 1920 : 1080;
window.DURATION = MODE === 'play' ? 32 : 15;

const $ = (id) => document.getElementById(id);
const stage = $('stage');
stage.style.width = SW + 'px'; stage.style.height = SH + 'px';

// ---------- maths ----------
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const lerp = (a, b, u) => a + (b - a) * u;
const E = {
  lin: (u) => u,
  out: (u) => 1 - Math.pow(1 - u, 3),
  inOut: (u) => (u < 0.5 ? 4 * u * u * u : 1 - Math.pow(-2 * u + 2, 3) / 2),
  in: (u) => u * u * u,
  // a calm spring: about 6 % overshoot, settled by the end
  spring: (u) => (u >= 1 ? 1 : 1 - Math.exp(-6.5 * u) * Math.cos(7.2 * u) * (1 - u * 0.0)),
  hold: () => 0,
};
/** keyframes: [[t, {props}, ease?], ...]; ease belongs to the segment that ENDS at that key. */
function track(keys) {
  return (t) => {
    if (t <= keys[0][0]) return keys[0][1];
    for (let i = 1; i < keys.length; i++) {
      const [tb, vb, eb] = keys[i];
      if (t < tb) {
        const [ta, va] = keys[i - 1];
        const u = (E[eb || 'inOut'])((t - ta) / (tb - ta));
        const o = {};
        for (const k in vb) o[k] = lerp(va[k] ?? vb[k], vb[k], u);
        for (const k in va) if (!(k in o)) o[k] = va[k];
        return o;
      }
    }
    // carry every prop forward
    const o = {}; for (const [, v] of keys) Object.assign(o, v); return o;
  };
}
/** Fill each key with the props of the key before, so a key only lists what changes. */
function chain(keys) {
  let cur = {};
  return track(keys.map(([t, v, e]) => { cur = { ...cur, ...v }; return [t, { ...cur }, e]; }));
}
const win = (t, a, b) => clamp((t - a) / (b - a));
function place(el, p, w, h) {
  el.style.transform = `translate(${p.x - w / 2}px, ${p.y - h / 2}px) rotate(${p.r || 0}deg) scale(${p.s ?? 1})`;
  el.style.opacity = p.o ?? 1;
  el.style.visibility = (p.o ?? 1) <= 0.001 ? 'hidden' : 'visible';
}

// ---------- fake QR (not a real code) ----------
function qrSvg(svg) {
  let seed = 7; const rnd = () => ((seed = (seed * 16807) % 2147483647) / 2147483647);
  const on = (x, y) => {
    const finder = (fx, fy) => { const dx = x - fx, dy = y - fy; if (dx < 0 || dy < 0 || dx > 6 || dy > 6) return null;
      return dx === 0 || dy === 0 || dx === 6 || dy === 6 || (dx >= 2 && dx <= 4 && dy >= 2 && dy <= 4); };
    for (const [fx, fy] of [[0, 0], [22, 0], [0, 22]]) { const f = finder(fx, fy); if (f !== null) return f; }
    if ((x <= 7 && y <= 7) || (x >= 21 && y <= 7) || (x <= 7 && y >= 21)) return false;
    return rnd() > 0.52;
  };
  let d = '';
  for (let y = 0; y < 29; y++) for (let x = 0; x < 29; x++) if (on(x, y)) d += `M${x} ${y}h1v1h-1z`;
  svg.innerHTML = `<path d="${d}" fill="#140D0B"/>`;
}
qrSvg($('qr1')); qrSvg($('qr2'));

// ---------- the abstract racing game on the monitor (made up; no real game) ----------
const g = $('game').getContext('2d');
const GW = 2240, GH = 1260;
function drawGame(t, cars, boost, dist) {
  const hz = GH * 0.46;
  const sky = g.createLinearGradient(0, 0, 0, hz);
  sky.addColorStop(0, '#0f0812'); sky.addColorStop(1, '#3a1410');
  g.fillStyle = sky; g.fillRect(0, 0, GW, hz);
  // sun with bands
  const sx = GW / 2, sy = hz - 30, sr = GH * 0.2;
  const sun = g.createLinearGradient(0, sy - sr, 0, sy + sr * 0.2);
  sun.addColorStop(0, '#ffb070'); sun.addColorStop(1, '#FF5500');
  g.save(); g.beginPath(); g.arc(sx, sy, sr, Math.PI, 0); g.closePath(); g.clip();
  g.fillStyle = sun; g.fillRect(sx - sr, sy - sr, sr * 2, sr);
  g.fillStyle = '#2a1010';
  for (let i = 0; i < 6; i++) { const yy = sy - sr * 0.08 - i * sr * 0.12; g.fillRect(sx - sr, yy, sr * 2, 4 + (5 - i) * 2.2); }
  g.restore();
  // mountains
  g.fillStyle = '#1b0c0d'; g.beginPath(); g.moveTo(0, hz);
  const mt = [0, .12, .2, .3, .38, .5, .62, .7, .8, .9, 1], mh = [.0, .09, .05, .12, .06, .02, .07, .13, .05, .1, 0];
  for (let i = 0; i < mt.length; i++) g.lineTo(mt[i] * GW, hz - mh[i] * GH);
  g.lineTo(GW, hz); g.closePath(); g.fill();
  g.strokeStyle = 'rgba(255,85,0,0.45)'; g.lineWidth = 3; g.stroke();
  // ground
  g.fillStyle = '#0c0607'; g.fillRect(0, hz, GW, GH - hz);
  const ph = dist % 1;
  g.strokeStyle = 'rgba(255,85,0,0.22)'; g.lineWidth = 2;
  for (let i = 0; i < 14; i++) {
    const z = 14 - i - ph; if (z <= 0.2) continue;
    const y = hz + (GH - hz) * (1 / z) * 1.1; if (y > GH) continue;
    g.beginPath(); g.moveTo(0, y); g.lineTo(GW, y); g.stroke();
  }
  for (let i = -12; i <= 12; i++) { g.beginPath(); g.moveTo(GW / 2 + i * 26, hz); g.lineTo(GW / 2 + i * 380, GH); g.stroke(); }
  // road
  const rTop = 40, rBot = GW * 0.42;
  g.fillStyle = '#140b0b'; g.beginPath();
  g.moveTo(GW / 2 - rTop, hz); g.lineTo(GW / 2 + rTop, hz); g.lineTo(GW / 2 + rBot, GH); g.lineTo(GW / 2 - rBot, GH); g.closePath(); g.fill();
  g.save(); g.shadowColor = '#FF5500'; g.shadowBlur = 24; g.strokeStyle = '#FF6a1a'; g.lineWidth = 7;
  g.beginPath(); g.moveTo(GW / 2 - rTop, hz); g.lineTo(GW / 2 - rBot, GH); g.moveTo(GW / 2 + rTop, hz); g.lineTo(GW / 2 + rBot, GH); g.stroke(); g.restore();
  // lane dashes
  g.fillStyle = 'rgba(246,237,233,0.75)';
  for (const lane of [-1 / 3, 1 / 3]) {
    for (let i = 0; i < 10; i++) {
      const z0 = 10 - i - ph * 2 % 1 - (i % 1), z1 = z0 - 0.45; if (z1 <= 0.25) continue;
      const y0 = hz + (GH - hz) * (1.1 / z0), y1 = hz + (GH - hz) * (1.1 / z1); if (y0 > GH) continue;
      const w0 = rTop + (rBot - rTop) * ((y0 - hz) / (GH - hz)), w1 = rTop + (rBot - rTop) * ((Math.min(y1, GH) - hz) / (GH - hz));
      g.beginPath(); g.moveTo(GW / 2 + lane * w0 - 3, y0); g.lineTo(GW / 2 + lane * w0 + 3, y0);
      g.lineTo(GW / 2 + lane * w1 + 7, Math.min(y1, GH)); g.lineTo(GW / 2 + lane * w1 - 7, Math.min(y1, GH)); g.fill();
    }
  }
  // speed streaks when boosting
  if (boost > 0.01) {
    g.strokeStyle = `rgba(255,170,110,${0.35 * boost})`; g.lineWidth = 4;
    for (let i = 0; i < 16; i++) {
      const a = (i / 16) * Math.PI * 2, k = ((t * 3 + i * 0.37) % 1);
      const r0 = 300 + k * 900, r1 = r0 + 160;
      g.beginPath(); g.moveTo(GW / 2 + Math.cos(a) * r0, hz + Math.sin(a) * r0 * 0.6); g.lineTo(GW / 2 + Math.cos(a) * r1, hz + Math.sin(a) * r1 * 0.6); g.stroke();
    }
  }
  // cars: {x: -1..1 across the road, y: 0..1 depth (1 = nearest), label}
  for (const c of [...cars].sort((a, b) => a.y - b.y)) drawCar(c, hz, rTop, rBot);
}
function drawCar(c, hz, rTop, rBot) {
  const y = hz + (GH - hz) * (0.55 + 0.4 * c.y);
  const roadW = rTop + (rBot - rTop) * ((y - hz) / (GH - hz));
  const x = GW / 2 + c.x * roadW * 0.62;
  const s = 0.55 + 0.5 * c.y;
  g.save(); g.translate(x, y); g.rotate((c.lean || 0) * 0.12); g.scale(s, s);
  g.fillStyle = 'rgba(0,0,0,0.45)'; g.beginPath(); g.ellipse(0, 18, 230, 30, 0, 0, Math.PI * 2); g.fill();
  g.fillStyle = '#0a0606'; rr(-205, -40, 70, 70, 14); rr(135, -40, 70, 70, 14);          // tyres
  const body = g.createLinearGradient(0, -170, 0, 20); body.addColorStop(0, '#3a2620'); body.addColorStop(1, '#1d1210');
  g.fillStyle = body; rr(-190, -120, 380, 130, 34);                                         // body
  g.fillStyle = '#26170f'; rr(-120, -190, 240, 90, 30);                                     // cabin
  g.fillStyle = 'rgba(255,140,80,0.25)'; rr(-100, -175, 200, 55, 18);                       // window glow
  g.save(); g.shadowColor = '#FF3b00'; g.shadowBlur = 40; g.fillStyle = '#FF4a10';
  rr(-175, -88, 110, 26, 12); rr(65, -88, 110, 26, 12); g.restore();                       // tail lights
  g.fillStyle = '#FF5500'; rr(-190, -124, 380, 8, 4);                                       // accent line
  if (c.label) {
    g.font = '700 70px "Space Grotesk"'; g.textAlign = 'center';
    g.fillStyle = '#FF5500'; rr(-80, -320, 160, 96, 48);
    g.fillStyle = '#140D0B'; g.fillText(c.label, 0, -248);
  }
  g.restore();
}
function rr(x, y, w, h, r) { g.beginPath(); g.roundRect(x, y, w, h, r); g.fill(); }

// ---------- build the overlay DOM ----------
const taps = $('taps'), fx = $('fx'), edit = $('edit'), minis = $('minis'), links = $('links');
function mk(cls, parent, html) { const d = document.createElement('div'); d.className = cls; if (html) d.innerHTML = html; parent.appendChild(d); return d; }
const ripple = mk('ripple', taps), press = mk('press', taps);
// editor: clones of the A and Y buttons (cut from the editor screenshot) + patches over where they were
const K = 1100 / 904;                       // the 20:9 screenshots are laid out on a 904x407 grid
function clone(cx, cy, r) {
  const d = mk('', edit); const size = r * 2 * K;
  Object.assign(d.style, { position: 'absolute', width: size + 'px', height: size + 'px', borderRadius: '50%',
    backgroundImage: `url(../store-graphics/play-2026-11/raw-poco/editor.png)`, backgroundSize: `${1100}px ${495}px`,
    backgroundPosition: `${-(cx - r) * K}px ${-(cy - r) * K}px`, left: 0, top: 0 });
  return d;
}
function patch(cx, cy, r) {
  const d = mk('', edit);
  Object.assign(d.style, { position: 'absolute', width: (r * 2 + 4) * K + 'px', height: (r * 2 + 4) * K + 'px', borderRadius: '50%',
    background: 'rgb(7,9,16)', left: (cx - r - 2) * K + 'px', top: (cy - r - 2) * K + 'px' });
  return d;
}
const patchA = patch(133, 335, 42), patchY = patch(133, 187, 42);
const cloneA = clone(133, 335, 42), cloneY = clone(133, 187, 42);
const ringA = mk('', edit), ringY = mk('', edit);
for (const r of [ringA, ringY]) Object.assign(r.style, { position: 'absolute', borderRadius: '50%', border: '4px dashed #FF5500', left: 0, top: 0 });
const handles = [0, 1, 2, 3].map(() => { const h = mk('', edit); Object.assign(h.style, { position: 'absolute', width: '22px', height: '22px', margin: '-11px 0 0 -11px', borderRadius: '6px', background: '#FF5500', left: 0, top: 0 }); return h; });
const finger = mk('finger', edit);

// S3 connection overlays
const wifi = mk('abs', fx, `<svg width="180" height="150" viewBox="0 0 180 150"><g fill="none" stroke="#FF5500" stroke-width="14" stroke-linecap="round">
  <path id="w3" d="M14 58a108 108 0 0 1 152 0"/><path id="w2" d="M42 88a68 68 0 0 1 96 0"/><path id="w1" d="M68 116a30 30 0 0 1 44 0"/></g>
  <circle cx="90" cy="138" r="11" fill="#FF5500"/></svg>`);
const wifiLbl = mk('abs label', fx, TX.wifi);
const usbLbl = mk('abs label', fx, TX.usb);
const usbSvg = mk('abs', fx, `<svg width="1920" height="1080"><path id="cable" d="" fill="none" stroke="#3b2a24" stroke-width="16" stroke-linecap="round"/>
  <path id="cableHi" d="" fill="none" stroke="#FF5500" stroke-width="5" stroke-linecap="round"/></svg>`);
usbSvg.style.transform = 'none';
// four players
const miniEls = [1, 2, 3, 4].map((n) => {
  const m = mk('abs mini', minis, `<img src="../store-graphics/play-2026-11/raw-poco/controller.png">`);
  const b = mk('abs badge', minis, 'P' + n);
  return { m, b };
});

// ---------- the timeline ----------
const P = MODE === 'play';
let T;   // tracks
if (P) {
  T = {
    glow: chain([[0, { x: 960, y: 640, o: 0.0 }], [1.2, { o: 1 }, 'out'], [28, { x: 960, y: 540 }], [29, { o: 1.15 }, 'out']]),
    phoneL: chain([
      [0.0, { x: 960, y: 1460, s: 0.94, r: -9, o: 1 }],
      [1.5, { y: 650, s: 1.0, r: 0 }, 'spring'],
      [4.0, {}], [4.9, { x: 1560, y: 870, s: 0.5, r: -5 }, 'spring'],
      [8.0, {}], [8.6, { x: 1560, y: 900, s: 0.48, o: 0 }, 'out'],
      [16.0, { x: 960, y: 1320, s: 0.56, r: 0, o: 1 }, 'hold'], [16.8, { y: 920 }, 'spring'],
      // tilt like a wheel: left on beat, right, back
      [17.0, {}], [17.6, { r: -17 }, 'spring'], [18.0, {}], [18.7, { r: 17 }, 'spring'], [19.0, {}], [19.6, { r: 0 }, 'spring'],
      [20.0, {}], [20.9, { x: 960, y: 610, s: 1.15 }, 'spring'],
      [24.0, {}], [24.8, { x: 330, y: 870, s: 0.313 }, 'spring'],
      [28.0, {}], [28.6, { o: 0, y: 900 }, 'out'],
    ]),
    darkL: chain([[0, { o: 1 }], [0.9, {}], [1.6, { o: 0 }, 'out']]),
    imR: chain([[0, { o: 0 }], [15.9, {}], [16.0, { o: 1 }, 'lin'], [20.0, {}], [20.5, { o: 0 }, 'lin']]),
    imE: chain([[0, { o: 0 }], [20.0, {}], [20.5, { o: 1 }, 'lin'], [24.0, {}], [24.4, { o: 0 }, 'lin']]),
    monitor: chain([
      [0, { x: 760, y: 470, s: 0.78, o: 0 }], [4.0, {}], [4.9, { y: 520, s: 0.85, o: 1 }, 'out'],
      [8.0, {}], [8.8, { x: 1400, y: 590, s: 0.58 }, 'spring'],
      [12.0, {}], [12.8, { x: 760, y: 580, s: 0.8 }, 'spring'],
      [16.0, {}], [16.8, { x: 960, y: 490, s: 0.85 }, 'spring'],
      [20.0, {}], [20.6, { y: 420, o: 0 }, 'out'],
      [24.0, { x: 960, y: 420, s: 0.62 }, 'hold'], [24.8, { y: 440, s: 0.66, o: 1 }, 'out'],
      [28.0, {}], [28.6, { o: 0, y: 400 }, 'out'],
    ]),
    server: chain([[0, { o: 0 }], [8.0, {}], [8.5, { o: 1 }, 'lin'], [16.0, {}], [16.5, { o: 0 }, 'lin']]),
    phoneP: chain([
      [0, { x: 560, y: 1400, s: 1, r: 0, o: 0 }], [8.0, { o: 1 }, 'hold'], [8.8, { y: 620 }, 'spring'],
      [12.0, {}], [12.8, { x: 1440, y: 640, s: 0.95, r: -5 }, 'spring'],
      [16.0, {}], [16.6, { o: 0, y: 700 }, 'out'],
    ]),
    cam: chain([[0, { o: 0 }], [12.3, {}], [12.7, { o: 1 }, 'lin'], [14.0, {}], [14.1, { o: 0 }, 'lin']]),
    flash: chain([[0, { o: 0 }], [13.98, {}], [14.02, { o: 0.9 }, 'lin'], [14.4, { o: 0 }, 'out']]),
    home: chain([[0, { o: 0 }], [14.0, {}], [14.05, { o: 1 }, 'lin']]),
    okpill: chain([[0, { x: 1440, y: 300, s: 0.6, o: 0 }], [14.1, {}], [14.6, { s: 1, o: 1 }, 'spring'], [16.0, {}], [16.4, { o: 0, s: 0.9 }, 'out']]),
    wifi: chain([[0, { x: 930, y: 470, s: 0.6, o: 0 }], [8.6, {}], [9.2, { s: 1, o: 1 }, 'spring'], [12.0, {}], [12.4, { o: 0 }, 'out']]),
    end: chain([[0, { o: 0 }], [28.3, {}], [28.8, { o: 1 }, 'out']]),
    endIcon: chain([[0, { s: 0.4 }], [28.3, {}], [29.1, { s: 1 }, 'spring']]),
  };
} else {
  // ---- website loop: 15 s, starts and ends on the same frame (phone + monitor, tap, tilt) ----
  const L = PORTRAIT;
  const mon = L ? { x: 540, y: 600, s: 0.82 } : { x: 760, y: 500, s: 0.92 };
  const ph = L ? { x: 540, y: 1330, s: 0.92 } : { x: 1440, y: 760, s: 0.62 };
  T = {
    glow: chain([[0, { x: SW / 2, y: SH * 0.6, o: 1 }]]),
    monitor: chain([[0, { ...mon, o: 1 }]]),
    phoneL: chain([
      [0, { ...ph, r: 0, o: 1 }],
      // 7-11 s: tilt left, right, back to level
      [7.0, {}], [7.7, { r: -16 }, 'spring'], [8.5, {}], [9.3, { r: 16 }, 'spring'], [10.0, {}], [10.8, { r: 0 }, 'spring'],
    ]),
    darkL: chain([[0, { o: 0 }]]),
    imR: chain([[0, { o: 0 }], [6.4, {}], [6.8, { o: 1 }, 'lin'], [11.6, {}], [12.0, { o: 0 }, 'lin']]),
    imE: chain([[0, { o: 0 }]]),
    server: chain([[0, { o: 0 }]]),
    phoneP: chain([[0, { x: 0, y: 0, o: 0 }]]),
    cam: chain([[0, { o: 0 }]]), flash: chain([[0, { o: 0 }]]), home: chain([[0, { o: 0 }]]),
    okpill: chain([[0, { x: 0, y: 0, o: 0 }]]), wifi: chain([[0, { x: 0, y: 0, o: 0 }]]),
    end: chain([[0, { o: 0 }]]), endIcon: chain([[0, { s: 1 }]]),
  };
}

// d-pad presses on the controller screen (904x407 grid): [time, x, y, lane change]
const DPAD_L = [318, 231], DPAD_R = [433, 231], BTN_A = [133, 336];
const TAPS = P
  ? [[5.0, ...DPAD_R, 1], [6.0, ...DPAD_L, 0], [7.0, ...DPAD_L, -1]]
  : [[1.0, ...DPAD_R, 1], [2.5, ...DPAD_L, 0], [4.0, ...DPAD_L, -1], [5.5, ...DPAD_R, 0], [12.5, ...DPAD_R, 1], [13.6, ...DPAD_L, 0]];

function laneAt(t) {
  // the car's lane follows the d-pad presses with a short spring
  let prev = 0, cur = 0, start = -9;
  for (const [tt, , , l] of TAPS) if (typeof l === 'number' && t >= tt) { prev = cur; cur = l; start = tt; }
  return lerp(prev, cur, E.spring(clamp((t - start) / 0.55)));
}
function boostAt(t) {
  let b = 0; for (const [tt, , , l] of TAPS) if (l === 'boost') b = Math.max(b, t >= tt ? Math.exp(-(t - tt) * 1.4) * clamp((t - tt) / 0.08) : 0);
  return b;
}
/** Distance driven (road scroll). Integrated so a boost never makes the road jump; 1.6 per second at cruise,
 *  which makes the 15 s web loop exactly 24 road segments long, so it loops without a seam. */
function distAt(t) {
  let d = 1.6 * t;
  for (const [tt, , , l] of TAPS) if (l === 'boost' && t > tt) d += 2.4 * (1 - Math.exp(-(t - tt) * 1.4)) / 1.4;
  return d;
}

// ---------- render one frame ----------
const SIZES = { phoneL: [1136, 531], phoneP: [374, 792], monitor: [1164, 674 + 88], okpill: [300, 70], wifi: [180, 150] };
let lastLang = '';
window.render = function render(t) {
  const v = {}; for (const k in T) v[k] = T[k](t);

  // glow
  const gl = v.glow;
  $('glow').style.background = `radial-gradient(${PORTRAIT ? '900px 900px' : '1100px 760px'} at ${gl.x}px ${gl.y}px, rgba(255,85,0,${0.2 * gl.o}), transparent 70%),
    radial-gradient(700px 520px at 10% 8%, rgba(255,85,0,${0.07 * Math.min(gl.o, 1)}), transparent 70%)`;

  place($('phoneL'), v.phoneL, ...SIZES.phoneL);
  $('darkL').style.opacity = v.darkL.o;
  $('imR').style.opacity = v.imR.o; $('imE').style.opacity = v.imE.o;
  $('edit').style.opacity = v.imE.o;
  place($('monitor'), { ...v.monitor, y: v.monitor.y + 44 }, ...SIZES.monitor);
  $('server').style.opacity = v.server.o;
  place($('phoneP'), v.phoneP, ...SIZES.phoneP);
  $('cam').style.opacity = v.cam.o; $('flash').style.opacity = v.flash.o; $('imHome').style.opacity = v.home.o;
  $('scanline').style.top = (38 + 16 * Math.sin((t - 12.3) * 3.2)) + '%';
  place($('okpill'), v.okpill, ...SIZES.okpill);
  const st = $('srvst'); const on = P && t >= 14.0;
  st.classList.toggle('on', on); st.lastChild.textContent = on ? 'Phone connected' : 'Waiting for your phone';

  // ---- game ----
  let cars;
  if (P && t >= 23.9) {
    cars = [-0.95, -0.32, 0.32, 0.95].map((x, i) => ({ x: x + 0.05 * Math.sin(t * 1.7 + i * 1.9), y: 0.25 + 0.1 * Math.sin(t * 1.1 + i), label: 'P' + (i + 1), lean: 0.3 * Math.cos(t * 1.7 + i * 1.9) }));
  } else {
    const steer = (v.phoneL.r || 0) / 17;                      // tilt -> steering
    const tiltOn = P ? t >= 16 && t < 20 : t >= 6.8 && t < 11.9;
    const x = tiltOn ? steer * 0.75 : laneAt(t) * 0.7;
    cars = [{ x, y: 0.72, lean: tiltOn ? steer : 0 }];
  }
  drawGame(t, cars, boostAt(t), distAt(t));

  // ---- taps on the controller ----
  let rp = null;
  for (const [tt, x, y] of TAPS) if (t >= tt && t < tt + 0.6) rp = { u: (t - tt) / 0.6, x, y };
  const kk = 1100 / 904;
  if (rp && v.imR.o < 0.5) {
    ripple.style.left = press.style.left = rp.x * kk + 'px'; ripple.style.top = press.style.top = rp.y * kk + 'px';
    ripple.style.transform = `scale(${0.5 + rp.u * 1.1})`; ripple.style.opacity = 1 - rp.u;
    press.style.opacity = Math.max(0, 1 - rp.u * 2.2); press.style.transform = `scale(${1 - rp.u * 0.2})`;
  } else { ripple.style.opacity = 0; press.style.opacity = 0; }

  // ---- editor: drag A (20.9-22.0), resize Y (22.3-23.4) ----
  if (P) {
    const dragU = E.inOut(win(t, 21.0, 22.0)), sizeU = E.spring(win(t, 22.4, 23.2));
    const ax = lerp(133, 290, dragU), ay = lerp(335, 345, dragU);
    const as = 1 + 0.2 * sizeU;
    const aGrab = win(t, 20.8, 21.0) * (1 - win(t, 22.05, 22.25));
    patchA.style.opacity = t >= 21.0 ? 1 : 0;
    place(cloneA, { x: ax * K, y: ay * K, s: as * (1 + 0.08 * aGrab) }, 84 * K, 84 * K);
    place(ringA, { x: ax * K, y: ay * K, s: as * (1 + 0.08 * aGrab), o: aGrab }, 102 * K, 102 * K);
    ringA.style.width = ringA.style.height = 102 * K + 'px';
    const yGrab = win(t, 22.2, 22.4) * (1 - win(t, 23.4, 23.6));
    patchY.style.opacity = 0; cloneY.style.opacity = 0; ringY.style.opacity = 0;
    place(ringY, { x: ax * K, y: ay * K, s: as, o: yGrab }, 102 * K, 102 * K);
    ringY.style.width = ringY.style.height = 102 * K + 'px';
    handles.forEach((h, i) => {
      const a = Math.PI / 4 + i * Math.PI / 2, rad = 51 * K * as;
      h.style.left = ax * K + Math.cos(a) * rad + 'px'; h.style.top = ay * K + Math.sin(a) * rad + 'px'; h.style.opacity = yGrab;
    });
    // finger: drags A, then pulls A's corner handle to make it bigger
    const hx = ax * K + Math.cos(Math.PI / 4) * 51 * K * as, hy = ay * K + Math.sin(Math.PI / 4) * 51 * K * as;
    let f = null;
    if (t >= 20.7 && t < 22.25) f = { x: ax * K, y: ay * K, o: aGrab };
    else if (t >= 22.25 && t < 23.7) f = { x: lerp(ax * K, hx, E.inOut(win(t, 22.05, 22.35))), y: lerp(ay * K, hy, E.inOut(win(t, 22.05, 22.35))), o: Math.max(win(t, 22.1, 22.3), 0) * (1 - win(t, 23.4, 23.65)) };
    if (f) { finger.style.left = f.x + 'px'; finger.style.top = f.y + 'px'; finger.style.opacity = f.o; } else finger.style.opacity = 0;
  } else { edit.style.opacity = 0; }

  // ---- S3: Wi-Fi and the USB cable ----
  place(wifi, v.wifi, ...SIZES.wifi);
  if (P) {
    const arcs = ['w1', 'w2', 'w3'];
    arcs.forEach((id, i) => { const k = ((t - 8.6) * 1.0 - i * 0.18) % 1; document.getElementById(id).style.opacity = t < 8.6 ? 0 : 0.35 + 0.65 * clamp(1 - Math.abs(k - 0.25) * 2.4); });
    const wl = v.wifi.o; Object.assign(wifiLbl.style, { transform: `translate(${930 - 60}px, ${570}px)`, opacity: wl });
    // the cable runs from the phone's bottom edge to the monitor's stand, drawn in 9.8 - 10.8 s
    const pp = v.phoneP, mm = v.monitor;
    const ax0 = pp.x + 150 * pp.s, ay0 = pp.y + 396 * pp.s;
    const bx0 = mm.x - 120 * mm.s, by0 = mm.y + 44 + (381 - 10) * mm.s;
    const d = `M${ax0} ${ay0} C ${ax0 + 40} ${ay0 + 70}, ${bx0 - 180} ${by0 + 90}, ${bx0} ${by0}`;
    const cab = document.getElementById('cable'), hi = document.getElementById('cableHi');
    cab.setAttribute('d', d); hi.setAttribute('d', d);
    const len = cab.getTotalLength() + 2, draw = E.out(win(t, 9.8, 10.8)), out = t < 9.8 ? 0 : 1 - win(t, 12.0, 12.4);
    for (const el of [cab, hi]) { el.style.strokeDasharray = len; el.style.strokeDashoffset = len * (1 - draw); el.style.opacity = out; }
    const ul = Math.min(E.out(win(t, 10.4, 10.9)), out), mid = cab.getPointAtLength(len * 0.55);
    Object.assign(usbLbl.style, { transform: `translate(${mid.x - 40}px, ${mid.y - 96}px)`, opacity: ul });
  } else { wifiLbl.style.opacity = 0; usbLbl.style.opacity = 0; usbSvg.style.opacity = 0; }

  // ---- S7: four phones, P1 is the main phone moving into place ----
  const XS = [330, 750, 1170, 1590];
  let lk = '';
  miniEls.forEach(({ m, b }, i) => {
    let o = 0, s = 0.34 / 0.34;
    if (P) {
      if (i === 0) { o = 0; }
      else { const u = win(t, 24.5 + (i - 1) * 0.25, 25.2 + (i - 1) * 0.25); o = Math.min(clamp(u * 3), 1 - win(t, 28.0, 28.5)); s = 0.6 + 0.4 * E.spring(u); }
    }
    place(m, { x: XS[i], y: 870, s, o }, 356, 169);
    const bo = P ? Math.min(E.out(win(t, 25.3 + i * 0.15, 25.8 + i * 0.15)), 1 - win(t, 28.0, 28.4)) : 0;
    place(b, { x: XS[i], y: 1010, o: bo, s: 0.8 + 0.2 * E.spring(win(t, 25.3 + i * 0.15, 25.9 + i * 0.15)) }, 90, 56);
    if (bo > 0) {
      const mm = v.monitor; const fx0 = mm.x, fy0 = mm.y + 44 + 380 * mm.s;
      lk += `<path d="M${XS[i]} ${870 - 110} Q ${(XS[i] + fx0) / 2} ${fy0 + 40} ${fx0} ${fy0}" fill="none" stroke="#FF5500" stroke-width="4" stroke-dasharray="10 14" stroke-dashoffset="${-t * 60}" opacity="${0.7 * bo}"/>`;
    }
  });
  links.innerHTML = lk;

  // ---- captions (play mode only): in on the bar + 0.15 s, out at the next bar ----
  const cap = $('capt');
  if (P && t < 28) {
    const i = Math.floor(t / 4), local = t - i * 4;
    const inU = E.out(win(local, 0.15, 0.75)), outU = E.in(win(local, 3.6, 3.98));
    const key = LANG + i;
    if (key !== lastLang) { cap.innerHTML = (TX.lines[i] || '').replace(/[&<>]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c])).replace(/\{([^}]+)\}/g, '<em>$1</em>'); lastLang = key; }
    const firstIn = i === 0 ? E.out(win(t, 0.6, 1.2)) : inU;
    cap.style.opacity = Math.min(firstIn, 1 - outU);
    cap.style.transform = `translateY(${(1 - firstIn) * 26 - outU * 14}px)`;
  } else cap.style.opacity = 0;

  // ---- end card ----
  const en = v.end;
  $('end').style.opacity = en.o; $('end').style.visibility = en.o > 0.001 ? 'visible' : 'hidden';
  $('endIcon').style.transform = `scale(${v.endIcon.s})`;
  $('endTag').textContent = TX.tag; $('endGp').textContent = TX.gp;
  const nameU = E.out(win(t, 28.7, 29.3)), tagU = E.out(win(t, 29.1, 29.7)), gpU = E.out(win(t, 29.6, 30.2));
  $('endName').style.cssText = `opacity:${nameU};transform:translateY(${(1 - nameU) * 20}px)`;
  $('endTag').style.cssText = `opacity:${tagU};transform:translateY(${(1 - tagU) * 16}px)`;
  $('endGp').style.cssText = `opacity:${gpU};transform:translateY(${(1 - gpU) * 16}px)`;
};

window.ready = (async () => {
  await document.fonts.ready;
  await Promise.all([...document.images].map((im) => (im.complete ? 0 : new Promise((r) => { im.onload = im.onerror = r; }))));
  await Promise.all([...document.images].map((im) => im.decode().catch(() => {})));
  render(0);
  return true;
})();
</script>
